_schema-version: '3.1'
ID: hack2build-mta-apps
version: 0.1.5
description: Projeto CAP para o Hack2Build

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install
        - npx cds build --production
        

modules:
  # Backend CAP (srv)
  - name: hack2build-srv
    type: nodejs
    path: gen/srv
    build-parameters:
      builder: npm
      ignore: [ 'node_modules/', 'default-env.json', '.env' ]
      build-result: .
    requires:
      - name: hack2build-destination      
    provides:
      - name: srv_api
        properties:
          url: ${default-url}

  # App UI5 principal
  - name: hack2build-myapplication
    type: html5
    path: app/hack2build.myapplication
    build-parameters:
      builder: custom
      ignore: [ 'node_modules/' ]
      commands:
        - npm install
        - npx ui5 build
        - npm run build
      supported-platforms: []
    requires:
      - name: hack2build-html5-repo-runtime
      - name: hack2build-destination
      - name: srv_api
        group: destinations
        properties:
          name: srv-api
          url: ~{url}
          forwardAuthToken: true

  - name: weighingcontracts
    type: html5
    path: app/weighingcontracts
    build-parameters:
      builder: custom
      commands:
        - npm install
        - npx ui5 build
        - npm run build
      supported-platforms: []
    requires:
      - name: hack2build-html5-repo-runtime
      - name: hack2build-destination
      - name: srv_api
        group: destinations
        properties:
          name: srv-api
          url: ~{url}
          forwardAuthToken: true

resources:
  - name: hack2build-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  - name: hack2build-html5-repo-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime

      
